# ==============================================================================
# POSTGRESQL EMPIRICAL BENCHMARK CONFIGURATION
# Project: Empirical Study of Indexing & Key Ordering on Tail Latency
# Target Engine: PostgreSQL 17 (B-Tree CBO & Bitmap Scan Evaluation)
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. NETWORK & CONNECTIONS
# ------------------------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 100

# ------------------------------------------------------------------------------
# 2. MEMORY ALLOCATION & BUFFER POOL (Host limit: 4GB RAM)
# ------------------------------------------------------------------------------
shared_buffers = 1GB
work_mem = 4MB                 # Deliberately constrained to observe Exact -> Lossy Bitmap transition
maintenance_work_mem = 256MB
effective_cache_size = 3GB

# ------------------------------------------------------------------------------
# 3. COST-BASED OPTIMIZER (CBO) PARAMETERS
# ------------------------------------------------------------------------------
seq_page_cost = 1.0
random_page_cost = 1.2         # Fast NVMe/SSD storage baseline
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005
cpu_operator_cost = 0.0025

# ------------------------------------------------------------------------------
# 4. DIAGNOSTICS & TELEMETRY TIMING
# ------------------------------------------------------------------------------
track_io_timing = on           # Required for EXPLAIN (BUFFERS, ANALYZE) read/write timing
track_wal_io_timing = on       # Required for WAL write/sync latency telemetry
track_activities = on
track_counts = on

# ------------------------------------------------------------------------------
# 5. WAL & CHECKPOINTS
# ------------------------------------------------------------------------------
wal_level = replica
wal_buffers = 16MB
checkpoint_completion_target = 0.9
max_wal_size = 4GB
min_wal_size = 512MB

# ------------------------------------------------------------------------------
# 6. PARALLEL QUERY WORKERS (Container limit: 4 CPU cores)
# ------------------------------------------------------------------------------
max_worker_processes = 4
max_parallel_workers = 4
max_parallel_workers_per_gather = 2

# ------------------------------------------------------------------------------
# 7. EXTENSIONS & LOGGING
# ------------------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
log_destination = 'stderr'
logging_collector = off
log_min_messages = warning
log_line_prefix = '%m [%p] %q%u@%d '
